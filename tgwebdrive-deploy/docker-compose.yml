services:
  tgwebdrive:
    build:
      context: ../tgwebdrive
      dockerfile: ../tgwebdrive-deploy/Dockerfile
    image: tgwebdrive:latest
    container_name: tgwebdrive
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "3001"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5

  cf-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cf-tgwd
    restart: unless-stopped
    depends_on:
      - tgwebdrive
    environment:
      TUNNEL_URL: "${TUNNEL_URL:-http://tgwebdrive:3001}"
    command: ["sh", "-c", "cloudflared tunnel --url \"$TUNNEL_URL\" --no-autoupdate"]
