# Nanobot Platform behind nginx with SSE support.
# Drop into /etc/nginx/sites-available/nanobot-platform and symlink to
# /etc/nginx/sites-enabled/, then `nginx -t && systemctl reload nginx`.

server {
    listen 80;
    server_name example.com;   # <- your domain or IP

    # Uploads up to 50 MB
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (chat streaming) must not be buffered
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header X-Accel-Buffering no;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
