services:
  nanobot-platform:
    build: .
    container_name: nanobot-platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # First-run admin credentials. If NANOBOT_ADMIN_PASSWORD is unset, a
      # random password is generated and written to data/admin-password.txt.
      NANOBOT_ADMIN_USER: admin
      NANOBOT_ADMIN_PASSWORD: ${NANOBOT_ADMIN_PASSWORD:-}
      NANOBOT_PLATFORM_DATA: /app/data
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/version').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
